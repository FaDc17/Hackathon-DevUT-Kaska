spring.application.name=kuska-api
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# Conexion con Azure SQL
spring.datasource.url=jdbc:sqlserver://sql-kuska-fadc.database.windows.net:1433;databaseName=free-sql-db-8911281;encrypt=true;trustServerCertificate=false;loginTimeout=30;
spring.datasource.username=${AZURE_SQL_USERNAME}
spring.datasource.password=${AZURE_SQL_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=30000

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
server.error.include-message=never
server.error.include-stacktrace=never

# JWT de acceso sin refresh token persistente; no altera el esquema Azure.
kuska.security.jwt.secret=${JWT_SECRET}
kuska.security.jwt.expiration-ms=${JWT_ACCESS_TOKEN_TTL_MS:900000}
kuska.security.cors.allowed-origins=${KUSKA_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080,capacitor://localhost,http://localhost,https://localhost}

# Verificacion JDBC al iniciar
kuska.database.expected-name=free-sql-db-8911281
kuska.database.expected-server=sql-kuska-fadc.database.windows.net
